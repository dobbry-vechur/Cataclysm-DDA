name: Cataclysm Windows build

on:
  push:
    branches:
    - master
    paths-ignore:
    - 'android/**'
    - 'build-data/osx/**'
    - 'doc/**'
    - 'doxygen_doc/**'
    - 'gfx/**'
    - 'lang/**'
    - 'lgtm/**'
    - 'tools/**'
    - '!tools/format/**'
    - 'utilities/**'
  pull_request:
    branches:
    - master
    paths-ignore:
    - 'android/**'
    - 'build-data/osx/**'
    - 'doc/**'
    - 'doxygen_doc/**'
    - 'gfx/**'
    - 'lang/**'
    - 'lgtm/**'
    - 'tools/**'
    - '!tools/format/**'
    - 'utilities/**'
    types: [opened, reopened, synchronize, ready_for_review]

# We only care about the latest revision of a PR, so cancel previous instances.
concurrency:
  group: msvc-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  # Enable pretty backtraces
  BACKTRACE: 1
  # Compressed size ~1GB based on observations
  CCACHE_LIMIT: 10GB
  # Dev Drive mount point (ReFS + Defender perf mode). Created by setup-dev-drive step.
  DEV_DRIVE: "V:"
  CDDA_DD_WORKSPACE: "V:\\Cataclysm-DDA"
  CDDA_CCACHE_PATH: "V:\\Cataclysm-DDA\\ccache\\"
  CDDA_USE_CCACHE: true
  # Force ccache cache dir onto Dev Drive (defaults to %APPDATA%\ccache on C:).
  CCACHE_DIR: "V:\\ccache-cache"
  VCPKG_OVERLAY_TRIPLETS: "V:\\Cataclysm-DDA\\.github\\vcpkg_triplets"
  # Also conveniently disable ccache internal compression
  CCACHE_HARDLINK: true
  ZSTD_CLEVEL: 17

jobs:
  build_catatclysm:
    name: Build
    runs-on: windows-2022
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    defaults:
      run:
        working-directory: "V:\\Cataclysm-DDA"

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Setup Dev Drive
      uses: samypr100/setup-dev-drive@30f0f98ae5636b2b6501e181dfb3631b9974818d # v4.0.0
      with:
        drive-size: "12GB"
        drive-format: "ReFS"
        drive-type: "Dynamic"
        mount-path: "V:"
        workspace-copy: true

    - name: Setup msys2
      uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2
      with:
        msystem: mingw64
        install: >-
          gettext
          make

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Use GNU tar to enable zstd for actions/cache
      run: |
        echo "Adding GNU tar to PATH"
        echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"
      shell: cmd

    - name: Install stable CMake
      uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # latest
      with:
        # 4.0.0 has issues compiling old packages
        cmakeVersion: 3.31.6

    - name: Install vcpkg
      uses: lukka/run-vcpkg@7d259227a1fb6471a0253dd5ab7419835228f7d7 # v11
      id: runvcpkg
      with:
        vcpkgDirectory: 'V:\vcpkg'
        vcpkgGitCommitId: '1b6e030cf096faf4f82d7b7025de8b2abee3e3df'

    - name: Integrate vcpkg
      run: |
        vcpkg integrate install --vcpkg-root "V:\vcpkg"

    - name: Cache vcpkg installed packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: V:\Cataclysm-DDA\msvc-full-features\vcpkg_installed
        key: vcpkg-installed-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-1b6e030cf096faf4f82d7b7025de8b2abee3e3df

    - name: Download ccache
      uses: robinraju/release-downloader@368754b9c6f47c345fcfbf42bcb577c2f0f5f395 # v1.9
      with:
        repository: 'ccache/ccache'
        tag: 'v4.6.1'
        fileName: 'ccache-4.6.1-windows-x86_64.zip'
        out-file-path: 'V:\Cataclysm-DDA'

    - name: Install ccache
      id: install-ccache
      run: |
        unzip ccache-4.6.1-windows-x86_64.zip
        cp ccache-4.6.1-windows-x86_64/ccache.exe ccache-4.6.1-windows-x86_64/cl.exe
        cp ccache-4.6.1-windows-x86_64/ccache.exe ccache-4.6.1-windows-x86_64/clang-cl.exe
        mv ccache-4.6.1-windows-x86_64 $env:CDDA_CCACHE_PATH

    - name: Get ccache vars
      id: get-vars
      run: |
        echo "datetime=$(/bin/date -u "+%Y%m%d%H%M")" >> $GITHUB_OUTPUT
        echo "datetime-seconds=$(/bin/date +%s)" >> $GITHUB_OUTPUT
        echo "ccache-path=V:\\ccache-cache" >> $GITHUB_OUTPUT
      shell: bash

    - name: ccache cache files
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.get-vars.outputs.ccache-path }}
        # double-dash after compiler is not a typo, it is to disambiguate between g++-<date> and g++-11-<date> for restore key prefix matching
        key: ccache-${{ github.ref_name }}-${{ runner.os }}-msvc--${{ steps.get-vars.outputs.datetime }}
        restore-keys: |
          ccache-master-${{ runner.os }}-msvc--

    - name: Configure ccache
      run: |
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -M 10G
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -s -v
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -z

    - name: Symlink intermediates onto Dev Drive
      run: |
        mkdir -p "V:\objwin"
        New-Item -ItemType SymbolicLink -Target "V:\objwin" objwin

    - name: Build
      run: |
          msbuild -m -p:Configuration=Release -p:Platform=x64 "-target:Cataclysm-vcpkg-static;Cataclysm-test-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features/Cataclysm-vcpkg-static.sln

    - name: Get ccache cache age cutoff
      id: get-cache-age
      run: |
        NOW=`/bin/date +%s`
        DELTA=$(( $NOW - ${STEPS_GET_VARS_OUTPUTS_DATETIME_SECONDS} ))
        echo "ccache-age=${DELTA}" >> $GITHUB_OUTPUT
      shell: bash
      env:
        STEPS_GET_VARS_OUTPUTS_DATETIME_SECONDS: ${{ steps.get-vars.outputs.datetime-seconds }}

    - name: Post-build ccache manipulation
      if: ${{ !failure() }}
      run: |
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -s -v
        & "$env:CDDA_CCACHE_PATH\ccache.exe" --evict-older-than ${env:STEPS_GET_CACHE_AGE_OUTPUTS_CCACHE_AGE}s
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -s -v
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -M ${{ env.CCACHE_LIMIT }}
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -c
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -s -v
      env:
        STEPS_GET_CACHE_AGE_OUTPUTS_CCACHE_AGE: ${{ steps.get-cache-age.outputs.ccache-age }}

    - name: clear ccache on PRs
      if: ${{ github.ref_name != 'master' }}
      run: |
        & "$env:CDDA_CCACHE_PATH\ccache.exe" -C

    - name: Dump vcpkg logs if build failed
      if: failure()
      run: |
        echo =================================================
        Get-ChildItem "V:\Cataclysm-DDA\msvc-full-features\vcpkg_installed" -Recurse
        echo =================================================
        Get-ChildItem "V:\vcpkg\buildtrees" |
        Foreach-Object {
            Get-ChildItem $_.FullName -Filter *.log |
            Foreach-Object {
              echo =================================================
              echo $_.FullName
              echo =================================================
              type $_.FullName
            }
        }

    - name: Compile .mo files for localization
      if: ${{ github.ref_name != 'master' }}
      shell: msys2 {0}
      run: |
          make -C lang -j2
          mkdir -p ./data/mods/TEST_DATA/lang/mo/ru/LC_MESSAGES
          msgfmt -f -o ./data/mods/TEST_DATA/lang/mo/ru/LC_MESSAGES/TEST_DATA.mo ./data/mods/TEST_DATA/lang/po/ru.po

    - name: Enable GitHub Actions problem matchers
      if: ${{ github.ref_name != 'master' }}
      run: |
          Write-Output "::add-matcher::build-scripts/problem-matchers/catch2.json"
          Write-Output "::add-matcher::build-scripts/problem-matchers/debugmsg.json"

    - name: Run tests
      if: ${{ github.ref_name != 'master' }}
      run: |
          .\Cataclysm-test-vcpkg-static-Release-x64.exe --min-duration 20 --rng-seed time --order lex --wait-for-keypress exit

    - name: Dump disk usage logs if job failed
      if: failure()
      run: |
        echo =================================================
        df
        echo =================================================
        du -sh *
        echo =================================================
        du -sh msvc-full-features/*
        echo =================================================
        du -sh tools/*
        echo =================================================
      shell: bash

    - name: Don't upload vcpkg cache on failure or PRs
      if: ${{ failure() || cancelled() || github.ref_name != 'master' }}
      run: |
        echo "RUNVCPKG_NO_CACHE=1" >> $GITHUB_ENV
      shell: bash
